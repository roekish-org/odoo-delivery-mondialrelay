name: Bug
description: Signaler un dysfonctionnement
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Description
      description: Que se passe-t-il, et que devrait-il se passer ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Créer un transporteur Mondial Relay
        2. ...
    validations:
      required: true
  - type: input
    id: odoo
    attributes:
      label: Version Odoo
      placeholder: "19.0"
    validations:
      required: true
  - type: input
    id: module
    attributes:
      label: Version du module
      placeholder: "19.0.1.0.0"
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Collez le message d'erreur. Masquez vos identifiants Mondial Relay.
      render: shell
