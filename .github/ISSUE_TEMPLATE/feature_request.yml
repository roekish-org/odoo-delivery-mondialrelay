name: Évolution
description: Proposer une fonctionnalité ou une amélioration
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Le besoin
      description: Quel problème cette évolution résout-elle ?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Solution envisagée
      description: Comment vous l'imaginez, si vous avez une idée.
  - type: textarea
    id: context
    attributes:
      label: Contexte
      description: Mode de livraison concerné (Point Relais, Locker, domicile), zone, cas d'usage.
