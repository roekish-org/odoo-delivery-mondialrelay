# Local Odoo 19 demo stack for the roekish_delivery_mondialrelay module.
# Usage:  make init   (build + install module with demo data)
#         make up      (start, then open http://localhost:8069)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "odoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: ./docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./:/mnt/extra-addons
      - ./docker/odoo.conf:/etc/odoo/odoo.conf
      - odoo-data:/var/lib/odoo
    command: odoo

volumes:
  db-data:
  odoo-data:
